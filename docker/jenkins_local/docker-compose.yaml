# docker-compose.yaml
version: '3.8'
networks:
  selenium_grid_default:
    external: true
services:
  jenkins:
    networks:
      - selenium_grid_default
    image: jenkins/jenkins:jdk17
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000docker logs:50000
    container_name: jenkins
    volumes:
      - ./jenkins_configuration:/var/jenkins_home
      - ./docker.sock:/var/run/docker.sock